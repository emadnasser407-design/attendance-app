name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies and Buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git python3-dev ccache libffi-dev libssl-dev zlib1g-dev python3-pip
        pip install --upgrade pip
        pip install buildozer cython

    - name: Run Buildozer to compile APK
      run: |
        buildozer -v android debug

    - name: Upload generated APK
      uses: actions/upload-artifact@v4.3.1
      with:
        name: app-debug
        path: bin/*.apk
